$:
  tag_push: # 发布到 preview 预览
    - docker:
        image: node:18
      stages:
        - name: show version
          script: node -v
        - name: install
          script: npm install -g pnpm && pnpm install --no-frozen-lockfile --verbose
        - name: build
          script: pnpm run build
        - name: update version
          script: cd ./dist/birdpaper-icon && npm version $CNB_BRANCH --no-git-tag-version
        - name: npm publish
          image: tencentcom/npm
          settings:
            username: $CNB_TOKEN_USER_NAME
            token: $CNB_TOKEN
            email: $CNB_COMMITTER_EMAIL
            registry: https://npm.cnb.cool/birdpaper-design/birdpaper-icon-preview/-/packages/
            folder: ./dist/birdpaper-icon
            fail_on_version_conflict: true
  web_trigger_one: # 发布到 npm 仓库
    - docker:
        image: node:18
      stages:
        - name: show version
          script: node -v
        - name: install
          script: npm install -g pnpm && pnpm install
        - name: build
          script: pnpm run build
        - name: update version
          script: cd ./dist/birdpaper-icon && npm version $CNB_BRANCH --no-git-tag-version
        - name: npm publish
          image: tencentcom/npm
          imports: https://cnb.cool/birdpaper-design/bp-env/-/blob/main/npm.yml
          settings:
            username: $NPM_USER
            token: $NPM_TOKEN
            email: $NPM_EMAIL
            folder: ./dist/birdpaper-icon
            fail_on_version_conflict: true